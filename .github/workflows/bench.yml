name: Benchmarks

# Shared CI runners are noisy: treat these numbers as trends, and run
# `cargo bench -p xz-bench` on a quiet machine for real comparisons.
on:
  workflow_dispatch:
  schedule:
    - cron: "0 5 * * 1"

permissions:
  contents: read

jobs:
  bench:
    name: bench ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: linux-x64, os: ubuntu-26.04 }
          - { name: linux-arm64, os: ubuntu-26.04-arm }
          - { name: windows-x64, os: windows-latest }
          - { name: windows-arm64, os: windows-11-arm }
          - { name: macos-arm64, os: macos-latest }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Run benchmarks
        shell: bash
        run: |
          cargo bench -p xz-bench -- --warm-up-time 1 --measurement-time 5 2>&1 | tee bench.txt
          # The same tables as BENCHMARK.md (mean throughput).
          {
            echo "## ${{ matrix.name }}"
            echo
            cargo run -q --release -p xz-bench --example bench_tables
          } >> "$GITHUB_STEP_SUMMARY"
          cargo run -q --release -p xz-bench --example bench_tables > tables.md
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: criterion-${{ matrix.name }}
          path: |
            target/criterion
            tables.md
