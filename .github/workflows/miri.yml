name: Miri

# All unit tests, including the encoder ones that the miri job in ci.yml
# skips (about an hour per target), so nightly only.
on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  miri:
    name: miri ${{ matrix.target }}
    runs-on: ubuntu-26.04
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        # Little endian and big endian.
        target: [x86_64-unknown-linux-gnu, s390x-unknown-linux-gnu]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: nightly
          components: miri
      - run: cargo miri setup --target ${{ matrix.target }}
      - name: Unit tests
        run: cargo miri test -p xz-native --lib --target ${{ matrix.target }}
      - name: xz test files
        run: cargo miri test -p xz-native --test xz_test_files --target ${{ matrix.target }}
        env:
          MIRIFLAGS: -Zmiri-disable-isolation
