name: Miri

# All unit tests, including the encoder ones that the miri job in ci.yml
# skips (one to two hours per target): weekly, for new Miri checks in the
# nightly toolchain, and by hand before each release (docs/RELEASING.md).
# Not on every merge: merges came faster than a run, so each push cancelled
# the run before it and few ever finished.
on:
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:

concurrency:
  # One run per ref at a time; a newer one waits instead of cancelling it.
  group: miri-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  miri:
    name: miri ${{ matrix.target }}
    runs-on: ubuntu-26.04
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        # Little endian and big endian.
        target: [x86_64-unknown-linux-gnu, s390x-unknown-linux-gnu]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: nightly
          components: miri
      - uses: taiki-e/install-action@86f7a0ffb25f40114606501a311ebcfaf882ea32 # v2.88.0
        with:
          tool: cargo-nextest
      - run: cargo miri setup --target ${{ matrix.target }}
      - name: Unit tests
        # Each test in its own Miri process, one per CPU.
        run: cargo miri nextest run -p xz-native --lib --target ${{ matrix.target }}
      - name: xz test files
        run: cargo miri test -p xz-native --test xz_test_files --target ${{ matrix.target }}
        env:
          MIRIFLAGS: -Zmiri-disable-isolation
