name: Miri

# All unit tests, including the encoder ones that the miri job in ci.yml
# skips (about an hour per target): after each merge that changes the
# library, and weekly for new Miri checks in the nightly toolchain.
on:
  push:
    branches: [main]
    paths:
      - "crates/xz-native/**"
      - ".github/workflows/miri.yml"
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:

concurrency:
  # Pushes to main share a group: a newer push cancels the older run, so
  # only the latest commit runs to the end. Scheduled and manual runs get
  # their own group, so a push never cancels them.
  group: miri-${{ (github.event_name == 'pull_request' || github.event_name == 'push') && github.ref || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  miri:
    name: miri ${{ matrix.target }}
    runs-on: ubuntu-26.04
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        # Little endian and big endian.
        target: [x86_64-unknown-linux-gnu, s390x-unknown-linux-gnu]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: nightly
          components: miri
      - run: cargo miri setup --target ${{ matrix.target }}
      - name: Unit tests
        run: cargo miri test -p xz-native --lib --target ${{ matrix.target }}
      - name: xz test files
        run: cargo miri test -p xz-native --test xz_test_files --target ${{ matrix.target }}
        env:
          MIRIFLAGS: -Zmiri-disable-isolation
