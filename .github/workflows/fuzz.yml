name: Fuzz

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
    inputs:
      seconds:
        description: Seconds per target
        default: "1800"

concurrency:
  group: fuzz-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fuzz:
    name: fuzz ${{ matrix.target }}
    runs-on: ubuntu-26.04
    strategy:
      fail-fast: false
      matrix:
        target: [decode_xz, decode_lzma, diff_liblzma]
    env:
      # Short runs on pushes and PRs, long runs nightly or on demand.
      SECONDS_PER_TARGET: ${{ github.event_name == 'schedule' && '1800' || github.event.inputs.seconds || '180' }}
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true
      - uses: dtolnay/rust-toolchain@nightly
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-fuzz
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: fuzz
      - name: Restore corpus
        uses: actions/cache/restore@v6
        with:
          path: fuzz/corpus/${{ matrix.target }}
          key: fuzz-corpus-${{ matrix.target }}-${{ github.run_id }}
          restore-keys: fuzz-corpus-${{ matrix.target }}-
      - name: Seed corpus from the xz test files
        shell: bash
        run: |
          dir=fuzz/corpus/${{ matrix.target }}
          mkdir -p "$dir"
          # The first input byte selects buffer sizes, and for diff_liblzma
          # the format (odd = .lzma, even = .xz).
          for f in third_party/xz/tests/files/*.xz; do
            { printf '\000'; cat "$f"; } > "$dir/seed-xz-$(basename "$f")"
          done
          for f in third_party/xz/tests/files/*.lzma; do
            { printf '\001'; cat "$f"; } > "$dir/seed-lzma-$(basename "$f")"
          done
      - name: Fuzz
        working-directory: fuzz
        run: >
          cargo fuzz run --target x86_64-unknown-linux-gnu ${{ matrix.target }} --
          -max_total_time=${{ env.SECONDS_PER_TARGET }}
          -rss_limit_mb=4096 -timeout=60 -max_len=1048576
      - name: Minimize corpus
        if: always()
        working-directory: fuzz
        run: cargo fuzz cmin --target x86_64-unknown-linux-gnu ${{ matrix.target }} || true
      - name: Save corpus
        if: always()
        uses: actions/cache/save@v6
        with:
          path: fuzz/corpus/${{ matrix.target }}
          key: fuzz-corpus-${{ matrix.target }}-${{ github.run_id }}
      - name: Upload crash artifacts
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: fuzz-artifacts-${{ matrix.target }}
          path: fuzz/artifacts/${{ matrix.target }}
          if-no-files-found: ignore
