name: Fuzz

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
    inputs:
      seconds:
        description: Seconds per target
        default: "1800"

concurrency:
  # Runs of the same PR share a group, so a new push cancels the old run.
  # Every other run (pushes to main, schedules) gets its own group and
  # runs to the end, so main's results (and the badge) are real.
  group: fuzz-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  fuzz:
    name: fuzz ${{ matrix.target }}
    runs-on: ubuntu-26.04
    strategy:
      fail-fast: false
      matrix:
        target: [decode_xz, decode_lzma, diff_liblzma, encode_roundtrip]
    env:
      # Short runs on pushes and PRs, long runs nightly or on demand.
      SECONDS_PER_TARGET: ${{ github.event_name == 'schedule' && '1800' || github.event.inputs.seconds || '180' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: nightly
      - uses: taiki-e/install-action@86f7a0ffb25f40114606501a311ebcfaf882ea32 # v2.88.0
        with:
          tool: cargo-fuzz
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: fuzz
      - name: Restore corpus
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: fuzz/corpus/${{ matrix.target }}
          key: fuzz-corpus-${{ matrix.target }}-${{ github.run_id }}
          restore-keys: fuzz-corpus-${{ matrix.target }}-
      - name: Seed corpus from the xz test files
        shell: bash
        run: |
          dir=fuzz/corpus/${{ matrix.target }}
          mkdir -p "$dir"
          # The first input byte selects buffer sizes, and for diff_liblzma
          # the format (odd = .lzma, even = .xz).
          for f in third_party/xz/tests/files/*.xz; do
            { printf '\000'; cat "$f"; } > "$dir/seed-xz-$(basename "$f")"
          done
          for f in third_party/xz/tests/files/*.lzma; do
            { printf '\001'; cat "$f"; } > "$dir/seed-lzma-$(basename "$f")"
          done
      - name: Fuzz
        working-directory: fuzz
        run: >
          cargo fuzz run --target x86_64-unknown-linux-gnu ${{ matrix.target }} --
          -max_total_time=${{ env.SECONDS_PER_TARGET }}
          -rss_limit_mb=4096 -timeout=60 -max_len=1048576
      - name: Minimize corpus
        if: always()
        working-directory: fuzz
        run: cargo fuzz cmin --target x86_64-unknown-linux-gnu ${{ matrix.target }} || true
      - name: Save corpus
        if: always()
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: fuzz/corpus/${{ matrix.target }}
          key: fuzz-corpus-${{ matrix.target }}-${{ github.run_id }}
      - name: Upload crash artifacts
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fuzz-artifacts-${{ matrix.target }}
          path: fuzz/artifacts/${{ matrix.target }}
          if-no-files-found: ignore
