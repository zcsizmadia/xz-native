name: Release

# Publishes xz-native to crates.io when a vX.Y.Z tag is pushed. The tag must
# match the crate version without its build metadata (0.1.0+xz.5.8.4 -> v0.1.0).
#
# Publishing uses crates.io trusted publishing: a short-lived token from
# GitHub's OIDC identity, no stored secret. It must be set up once on
# crates.io (crate settings -> Trusted Publishing: this repository, workflow
# release.yml, environment release), which needs the crate to exist, so the
# very first version is published by hand with `cargo publish`.
on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  verify:
    name: verify
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
      - name: Tag matches the crate version
        shell: bash
        run: |
          version=$(cargo metadata --no-deps --format-version 1 \
            | jq -r '.packages[] | select(.name == "xz-native") | .version')
          echo "crate $version, tag $GITHUB_REF_NAME"
          test "v${version%%+*}" = "$GITHUB_REF_NAME"
      - name: Tests
        run: cargo test --workspace --profile ci
        env:
          XZ_NATIVE_REQUIRE_XZ: "1"
      - run: cargo publish -p xz-native --dry-run

  publish:
    name: publish to crates.io
    needs: verify
    runs-on: ubuntu-26.04
    # Protect this environment (required reviewers) to approve each release.
    environment: release
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
      - uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18 # v1.0.5
        id: auth
      - run: cargo publish -p xz-native
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
