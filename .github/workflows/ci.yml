name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  # Runs of the same PR share a group, so a new push cancels the old run.
  # Every other run (pushes to main, schedules) gets its own group and
  # runs to the end, so main's results (and the badge) are real.
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

permissions:
  contents: read

jobs:
  lint:
    name: fmt, clippy, docs
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
          components: rustfmt, clippy
          # Lint the non-x86 and portable cfgs too, not only the default build.
          targets: aarch64-unknown-linux-gnu
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo clippy -p xz-native --no-default-features -- -D warnings
      - run: cargo clippy -p xz-native --all-targets --features portable -- -D warnings
      - run: cargo clippy -p xz-native --all-targets --features tokio,futures-io -- -D warnings
      - run: cargo clippy -p xz-native --all-targets --target aarch64-unknown-linux-gnu -- -D warnings
      - run: cargo doc -p xz-native --no-deps --features tokio,futures-io
        env:
          RUSTDOCFLAGS: -D warnings

  deny:
    name: cargo-deny
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          command: check advisories bans licenses sources

  test:
    name: test ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: linux-x64, os: ubuntu-26.04, require_xz: "1" }
          - { name: linux-arm64, os: ubuntu-26.04-arm, require_xz: "1" }
          - { name: windows-x64, os: windows-latest, require_xz: "" }
          - { name: windows-arm64, os: windows-11-arm, require_xz: "" }
          - { name: macos-arm64, os: macos-latest, require_xz: "1" }
    env:
      XZ_NATIVE_REQUIRE_XZ: ${{ matrix.require_xz }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: ${{ matrix.name }}
      - name: Install xz (macOS)
        if: runner.os == 'macOS'
        run: brew list xz >/dev/null 2>&1 || brew install xz
      - name: Report CPU features
        shell: bash
        run: |
          grep -o -w -E 'pclmulqdq|sha_ni|avx2|avx512f|vpclmulqdq' /proc/cpuinfo 2>/dev/null | sort -u || true
          grep -m1 Features /proc/cpuinfo 2>/dev/null || true
          sysctl -a 2>/dev/null | grep -E 'hw.optional.arm.FEAT_(PMULL|CRC32|SHA256)' || true
      - name: Test (SIMD paths selected at run time)
        run: cargo test --workspace --profile ci
      - name: Test (portable fallbacks)
        run: cargo test -p xz-native --profile ci --features portable
      - name: Test (async adapters)
        run: |
          cargo test -p xz-native --profile ci --features tokio,futures-io --test async_io
          cargo test -p xz-native --profile ci --features tokio,futures-io --doc
      - name: Test (32-bit)
        # Dictionary and buffer sizes from untrusted headers hit the 32-bit
        # address space limits.
        if: matrix.name == 'windows-x64'
        run: |
          rustup target add i686-pc-windows-msvc
          cargo test -p xz-native --profile ci --target i686-pc-windows-msvc
      - name: Build benchmarks
        run: cargo bench -p xz-bench --no-run

  targets:
    name: build ${{ matrix.target }}
    runs-on: ubuntu-26.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: thumbv7em-none-eabihf, flags: --no-default-features }
          - { target: wasm32-unknown-unknown, flags: "" }
          - { target: i686-unknown-linux-gnu, flags: "" }
          - { target: aarch64-unknown-linux-gnu, flags: --no-default-features }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
          targets: ${{ matrix.target }}
      - run: cargo build -p xz-native --release --target ${{ matrix.target }} ${{ matrix.flags }}

  msrv:
    name: MSRV
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: "1.89"
      - run: cargo check -p xz-native
      - run: cargo check -p xz-native --no-default-features
      - run: cargo check -p xz-native --features tokio,futures-io

  miri:
    name: miri ${{ matrix.target }}
    runs-on: ubuntu-26.04
    strategy:
      fail-fast: false
      matrix:
        # Little endian and big endian. Tests use smaller inputs under
        # cfg(miri).
        target: [x86_64-unknown-linux-gnu, s390x-unknown-linux-gnu]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: nightly
          components: miri
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: miri-${{ matrix.target }}
      - run: cargo miri setup --target ${{ matrix.target }}
      - name: Unit tests
        # The unsafe code: checksums, decoder, match finder prefetch. The
        # encoder tests are safe code and slow under Miri (about 45 minutes);
        # miri.yml runs them after merges and weekly.
        run: >
          cargo miri test -p xz-native --lib --target ${{ matrix.target }} --
          --skip lzma2_encoder:: --skip range_encoder:: --skip xz::encoder::
          --skip xz::mt_encoder:: --skip normalization_is_transparent
          --skip binary_trees_find_longest_match
      - name: xz test files
        run: cargo miri test -p xz-native --test xz_test_files --target ${{ matrix.target }}
        env:
          MIRIFLAGS: -Zmiri-disable-isolation
