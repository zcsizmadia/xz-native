name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  # Runs of the same PR share a group, and so do pushes to main: a newer
  # push cancels the older run, so only the latest commit runs to the end
  # (and the badge shows it). Scheduled and manual runs get their own
  # group, so a push never cancels them.
  group: ci-${{ (github.event_name == 'pull_request' || github.event_name == 'push') && github.ref || github.run_id }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

permissions:
  contents: read

jobs:
  lint:
    name: fmt, clippy, docs
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
          components: rustfmt, clippy
          # Lint the non-x86 and portable cfgs too, not only the default build.
          targets: aarch64-unknown-linux-gnu
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo clippy -p xz-native --no-default-features -- -D warnings
      - run: cargo clippy -p xz-native --all-targets --features portable -- -D warnings
      - run: cargo clippy -p xz-native --all-targets --features tokio,futures-io -- -D warnings
      - run: cargo clippy -p xz-native --all-targets --target aarch64-unknown-linux-gnu -- -D warnings
      - run: cargo doc -p xz-native --no-deps --features tokio,futures-io
        env:
          RUSTDOCFLAGS: -D warnings

  deny:
    name: cargo-deny
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          command: check advisories bans licenses sources

  semver:
    name: semver checks
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Against the latest release on crates.io; portable is outside SemVer.
      - uses: obi1kenobi/cargo-semver-checks-action@6b69fcf40e9b5fb17adeb57e4b6ecd020649a239 # v2.9
        with:
          package: xz-native
          feature-group: default-features
          features: tokio,futures-io

  test:
    name: test ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # simd: the SIMD paths the runner has, which the tests must
          # detect (otherwise they would compare the generic code with
          # itself).
          - { name: linux-x64, os: ubuntu-26.04, require_xz: "1", simd: "clmul" }
          - { name: linux-arm64, os: ubuntu-26.04-arm, require_xz: "1", simd: "clmul,crc,sha" }
          - { name: windows-x64, os: windows-latest, require_xz: "", simd: "clmul" }
          - { name: windows-arm64, os: windows-11-arm, require_xz: "", simd: "clmul,crc" }
          - { name: macos-arm64, os: macos-latest, require_xz: "1", simd: "clmul,crc,sha" }
    env:
      XZ_NATIVE_REQUIRE_XZ: ${{ matrix.require_xz }}
      XZ_NATIVE_REQUIRE_SIMD: ${{ matrix.simd }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: ${{ matrix.name }}
      - name: Install xz (macOS)
        if: runner.os == 'macOS'
        run: brew list xz >/dev/null 2>&1 || brew install xz
      - name: Report CPU features
        shell: bash
        run: |
          grep -o -w -E 'pclmulqdq|sha_ni|avx2|avx512f|vpclmulqdq' /proc/cpuinfo 2>/dev/null | sort -u || true
          grep -m1 Features /proc/cpuinfo 2>/dev/null || true
          sysctl -a 2>/dev/null | grep -E 'hw.optional.arm.FEAT_(PMULL|CRC32|SHA256)' || true
      - name: Test (SIMD paths selected at run time)
        run: cargo test --workspace --profile ci
      - name: Test (portable fallbacks)
        run: cargo test -p xz-native --profile ci --features portable
      - name: Test (no_std unit tests)
        run: cargo test -p xz-native --profile ci --no-default-features --lib
      - name: Test (async adapters)
        run: |
          cargo test -p xz-native --profile ci --features tokio,futures-io --test async_io --test auto_traits
          cargo test -p xz-native --profile ci --features tokio,futures-io --doc
      - name: Test (doc examples, unoptimized)
        # Users' debug builds: large values on the stack overflow Windows'
        # 1 MiB main thread stack without optimization.
        if: runner.os == 'Windows'
        run: cargo test -p xz-native --all-features --doc
      - name: Test (32-bit)
        # Dictionary and buffer sizes from untrusted headers hit the 32-bit
        # address space limits.
        if: matrix.name == 'windows-x64'
        run: |
          rustup target add i686-pc-windows-msvc
          cargo test -p xz-native --profile ci --target i686-pc-windows-msvc
      - name: Build benchmarks
        run: cargo bench -p xz-bench --no-run

  targets:
    name: build ${{ matrix.target }}
    runs-on: ubuntu-26.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: thumbv7em-none-eabihf, flags: --no-default-features }
          - { target: wasm32-unknown-unknown, flags: "" }
          - { target: i686-unknown-linux-gnu, flags: "" }
          - { target: aarch64-unknown-linux-gnu, flags: --no-default-features }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
          targets: ${{ matrix.target }}
      - run: cargo build -p xz-native --release --target ${{ matrix.target }} ${{ matrix.flags }}

  msrv:
    name: MSRV
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: "1.89"
      - run: cargo check -p xz-native
      - run: cargo check -p xz-native --no-default-features
      - run: cargo check -p xz-native --features tokio,futures-io

  miri:
    name: miri ${{ matrix.target }}
    runs-on: ubuntu-26.04
    strategy:
      fail-fast: false
      matrix:
        # Little endian and big endian. Tests use smaller inputs under
        # cfg(miri).
        target: [x86_64-unknown-linux-gnu, s390x-unknown-linux-gnu]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: nightly
          components: miri
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: miri-${{ matrix.target }}
      - uses: taiki-e/install-action@682ce6c3c696a4cd5168a05f98e51aa02b877941 # v2.89.1
        with:
          tool: cargo-nextest
      - run: cargo miri setup --target ${{ matrix.target }}
      - name: Unit tests
        # The unsafe code: the decoder's hot-path reads, the match finder
        # prefetch hints and the checksums. Miri reports only the target's
        # compile-time CPU features, so here the checksums take the generic
        # code; the next step runs the SIMD paths. Not covered by Miri at
        # all: the x86-64 decoder assembly (Miri can't run inline asm) and
        # the huge page hint (an OS call), both compiled out under
        # cfg(miri). The encoder tests and the BCJ split test are safe code
        # and slow under Miri (about 45 and 17 minutes); miri.yml runs them
        # weekly and before each release. nextest runs each test in its own
        # Miri process, one per CPU.
        run: >
          cargo miri nextest run -p xz-native --lib --target ${{ matrix.target }}
          -E 'not (test(~lzma2_encoder::) | test(~range_encoder::)
          | test(~xz::encoder::) | test(~xz::mt_encoder::)
          | test(~normalization_is_transparent)
          | test(~binary_trees_find_longest_match)
          | test(~bcj_stage_any_split))'
      - name: SIMD checksums
        # The CPU features enabled at compile time, so that Miri's feature
        # detection reports them and the check:: tests compare each SIMD
        # path (x86-64: CLMUL, VPCLMUL, SHA; AArch64, interpreted on this
        # runner: CRC32, PMULL, SHA2) with the generic code (#178).
        # XZ_NATIVE_REQUIRE_SIMD fails the run if a path isn't selected.
        if: matrix.target == 'x86_64-unknown-linux-gnu'
        env:
          MIRIFLAGS: -Zmiri-env-forward=XZ_NATIVE_REQUIRE_SIMD
        run: |
          cargo miri setup --target aarch64-unknown-linux-gnu
          XZ_NATIVE_REQUIRE_SIMD=clmul,vpclmul,sha \
          RUSTFLAGS="-C target-feature=+pclmulqdq,+ssse3,+sse4.1,+avx2,+vpclmulqdq,+sha" \
            cargo miri test -p xz-native --lib --target x86_64-unknown-linux-gnu \
            --target-dir target/miri-simd check::
          XZ_NATIVE_REQUIRE_SIMD=clmul,crc,sha \
          RUSTFLAGS="-C target-feature=+crc,+aes,+sha2" \
            cargo miri test -p xz-native --lib --target aarch64-unknown-linux-gnu \
            --target-dir target/miri-simd check::
      - name: xz test files
        run: cargo miri test -p xz-native --test xz_test_files --target ${{ matrix.target }}
        env:
          MIRIFLAGS: -Zmiri-disable-isolation
