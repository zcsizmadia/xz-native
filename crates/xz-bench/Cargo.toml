[package]
name = "xz-bench"
description = "Benchmarks: xz-native vs lzma-rust2 (best pure-Rust crate) and liblzma 5.8.4 (C reference)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[dependencies]
xz-native = { path = "../xz-native" }

[dev-dependencies]
criterion = { version = "0.8", default-features = false, features = ["cargo_bench_support"] }
lzma-rust2 = "0.24"
# C liblzma 5.8.4 built from the bundled source. Used only as a speed
# reference and to produce test inputs; never a dependency of xz-native.
liblzma = { version = "0.4.9", features = ["static", "parallel"] }
liblzma-sys = { version = "0.4.9", features = ["static"] }

[[bench]]
name = "decode"
harness = false

[[bench]]
name = "check"
harness = false

[[bench]]
name = "encode"
harness = false

[lints]
workspace = true
