[package]
name = "xz-native"
description = "Pure Rust XZ/LZMA compression and decompression, compatible with xz/liblzma: byte-identical output, the same strictness on bad input, no C code."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
readme = "../../README.md"
keywords = ["xz", "lzma", "lzma2", "compression", "decompression"]
categories = ["compression", "no-std"]
# The tests read xz's test files from third_party, which the package doesn't ship;
# they run in the repository and in CI.
exclude = ["tests/"]

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[features]
default = ["std"]
## The std::io types, threads and run-time CPU feature detection; without
## it the crate is no_std + alloc.
std = []
## Disables the SIMD and assembly paths and bounds-checks the decoder's
## hot-path reads, so no unsafe code runs. For testing the fallbacks: it
## changes speed, never results, and isn't covered by SemVer.
portable = []
## Async readers and writers for tokio (`xz_native::tokio`).
tokio = ["std", "dep:tokio"]
## Async readers and writers for the futures-io traits (`xz_native::futures`).
futures-io = ["std", "dep:futures-io"]

[dependencies]
# Only their I/O traits are used.
tokio = { version = "1.0", optional = true, default-features = false }
futures-io = { version = "0.3", optional = true, default-features = false, features = ["std"] }

[dev-dependencies]
tokio = { version = "1.0", features = ["io-util", "macros", "rt"] }
futures = { version = "0.3", default-features = false, features = ["executor", "std"] }

[lints]
workspace = true
