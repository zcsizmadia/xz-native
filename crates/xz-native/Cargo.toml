[package]
name = "xz-native"
description = "Pure Rust XZ/LZMA compression and decompression, compatible with xz/liblzma: byte-identical output, the same strictness on bad input, no C code."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
readme = "../../README.md"
keywords = ["xz", "lzma", "lzma2", "compression", "decompression"]
categories = ["compression", "no-std"]
# The tests read xz's test files from third_party, which the package doesn't ship;
# they run in the repository and in CI.
exclude = ["tests/"]

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[features]
default = ["std"]
## std::io adapters and runtime CPU feature detection.
std = []
## Disable all SIMD/CPU-specific code paths (for testing the portable fallbacks).
portable = []

[dependencies]

[dev-dependencies]

[lints]
workspace = true
